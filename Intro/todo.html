<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulse Todo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #12131a;
        --muted: #6a6f7d;
        --canvas: #f6f3ed;
        --accent: #ff6a3d;
        --accent-2: #0f766e;
        --card: #fff8ee;
        --line: rgba(18, 19, 26, 0.08);
        --shadow: 0 24px 60px rgba(18, 19, 26, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 20% 20%, #ffe6d8 0%, transparent 50%),
          radial-gradient(circle at 85% 10%, #d7f4f1 0%, transparent 45%),
          linear-gradient(135deg, #f6f3ed 0%, #f1efe7 100%);
        color: var(--ink);
        display: grid;
        place-items: center;
        padding: 40px 16px;
      }

      .app {
        width: min(920px, 100%);
        background: var(--card);
        border-radius: 28px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(255, 255, 255, 0.6);
        padding: 32px;
        display: grid;
        gap: 24px;
        position: relative;
        overflow: hidden;
      }

      .app::after {
        content: "";
        position: absolute;
        inset: -30% 55% auto auto;
        width: 320px;
        height: 320px;
        background: radial-gradient(
          circle,
          rgba(255, 106, 61, 0.2),
          transparent 70%
        );
        filter: blur(10px);
        pointer-events: none;
      }

      header {
        display: grid;
        gap: 12px;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }

      h1 {
        font-size: clamp(28px, 4vw, 40px);
        margin: 0;
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: var(--muted);
        margin: 0;
        font-size: 15px;
      }

      .stats {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .stat {
        background: #ffffff;
        border: 1px solid var(--line);
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 14px;
        color: var(--muted);
        display: inline-flex;
        gap: 8px;
        align-items: center;
      }

      .stat strong {
        color: var(--ink);
      }

      .composer {
        display: grid;
        gap: 12px;
      }

      .input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      .input-row input {
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: #fff;
        font-size: 16px;
        outline: none;
        transition:
          border 0.2s ease,
          box-shadow 0.2s ease;
      }

      .input-row input:focus {
        border-color: rgba(255, 106, 61, 0.6);
        box-shadow: 0 0 0 4px rgba(255, 106, 61, 0.15);
      }

      .primary-btn {
        background: var(--accent);
        color: #fff;
        border: none;
        padding: 16px 22px;
        border-radius: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 14px 30px rgba(255, 106, 61, 0.25);
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 35px rgba(255, 106, 61, 0.3);
      }

      .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .filter-btn {
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        padding: 8px 14px;
        font-size: 14px;
        cursor: pointer;
        color: var(--muted);
        transition: all 0.2s ease;
      }

      .filter-btn.active {
        background: var(--accent-2);
        border-color: transparent;
        color: #fff;
      }

      .todo-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      .todo-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid var(--line);
        animation: slideUp 0.35s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .todo-text {
        font-size: 16px;
      }

      .todo-item.completed .todo-text {
        color: var(--muted);
        text-decoration: line-through;
      }

      .check {
        width: 22px;
        height: 22px;
        border-radius: 8px;
        border: 2px solid var(--accent-2);
        display: inline-grid;
        place-items: center;
        cursor: pointer;
        background: #fff;
      }

      .todo-item.completed .check {
        background: var(--accent-2);
      }

      .check span {
        color: #fff;
        font-size: 14px;
        line-height: 1;
        opacity: 0;
        transform: scale(0.8);
        transition: all 0.2s ease;
      }

      .todo-item.completed .check span {
        opacity: 1;
        transform: scale(1);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .icon-btn {
        border: none;
        background: #f6f3ed;
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        color: var(--ink);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .icon-btn:hover {
        background: #efe9df;
        transform: translateY(-1px);
      }

      .empty {
        padding: 20px;
        border-radius: 18px;
        border: 1px dashed var(--line);
        color: var(--muted);
        background: rgba(255, 255, 255, 0.6);
        text-align: center;
      }

      @media (max-width: 720px) {
        .app {
          padding: 24px;
        }

        .input-row {
          grid-template-columns: 1fr;
        }

        .primary-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="title-row">
          <div>
            <h1>Pulse Todo</h1>
            <p class="subtitle">Keep momentum with small wins, every day.</p>
          </div>
          <div class="stats">
            <div class="stat"><strong id="totalCount">0</strong> total</div>
            <div class="stat"><strong id="activeCount">0</strong> active</div>
            <div class="stat"><strong id="doneCount">0</strong> done</div>
          </div>
        </div>
      </header>

      <section class="composer">
        <div class="input-row">
          <input
            id="todoInput"
            type="text"
            placeholder="What needs a push today?"
            autocomplete="off"
          />
          <button id="addTodoBtn" class="primary-btn">Add Task</button>
        </div>
        <div class="filters" role="tablist" aria-label="Todo filters">
          <button class="filter-btn active" data-filter="all" role="tab">
            All
          </button>
          <button class="filter-btn" data-filter="active" role="tab">
            Active
          </button>
          <button class="filter-btn" data-filter="done" role="tab">Done</button>
        </div>
      </section>

      <section>
        <ul id="todoList" class="todo-list"></ul>
        <div id="emptyState" class="empty" hidden>
          Your list is clear. Add a task to get rolling.
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const todoInput = document.getElementById("todoInput");
        const addTodoBtn = document.getElementById("addTodoBtn");
        const todoList = document.getElementById("todoList");
        const emptyState = document.getElementById("emptyState");
        const totalCount = document.getElementById("totalCount");
        const activeCount = document.getElementById("activeCount");
        const doneCount = document.getElementById("doneCount");
        const filterButtons = Array.from(
          document.querySelectorAll(".filter-btn"),
        );

        let todos = JSON.parse(localStorage.getItem("todos")) || [];
        let activeFilter = "all";

        function saveTodos() {
          localStorage.setItem("todos", JSON.stringify(todos));
        }

        function updateStats() {
          const total = todos.length;
          const done = todos.filter((todo) => todo.completed).length;
          totalCount.textContent = total;
          doneCount.textContent = done;
          activeCount.textContent = total - done;
        }

        function getVisibleTodos() {
          if (activeFilter === "active") {
            return todos.filter((todo) => !todo.completed);
          }
          if (activeFilter === "done") {
            return todos.filter((todo) => todo.completed);
          }
          return todos;
        }

        function renderTodos() {
          todoList.innerHTML = "";
          const visible = getVisibleTodos();
          emptyState.hidden = visible.length !== 0;

          visible.forEach((todo) => {
            const li = document.createElement("li");
            li.className = `todo-item${todo.completed ? " completed" : ""}`;

            const check = document.createElement("button");
            check.className = "check";
            check.type = "button";
            check.setAttribute(
              "aria-label",
              todo.completed ? "Mark as active" : "Mark as done",
            );
            check.dataset.id = todo.id;
            const checkIcon = document.createElement("span");
            checkIcon.textContent = "✓";
            check.appendChild(checkIcon);

            const text = document.createElement("div");
            text.className = "todo-text";
            text.textContent = todo.text;

            const actions = document.createElement("div");
            actions.className = "actions";

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "icon-btn";
            deleteBtn.type = "button";
            deleteBtn.textContent = "Remove";
            deleteBtn.dataset.id = todo.id;

            actions.appendChild(deleteBtn);
            li.appendChild(check);
            li.appendChild(text);
            li.appendChild(actions);
            todoList.appendChild(li);
          });

          updateStats();
        }

        function addTodo() {
          const todoText = todoInput.value.trim();
          if (!todoText) {
            return;
          }

          todos.unshift({
            id: crypto.randomUUID(),
            text: todoText,
            completed: false,
          });
          todoInput.value = "";
          saveTodos();
          renderTodos();
        }

        function toggleComplete(id) {
          todos = todos.map((todo) => {
            if (todo.id === id) {
              return { ...todo, completed: !todo.completed };
            }
            return todo;
          });
          saveTodos();
          renderTodos();
        }

        function deleteTodo(id) {
          todos = todos.filter((todo) => todo.id !== id);
          saveTodos();
          renderTodos();
        }

        addTodoBtn.addEventListener("click", addTodo);
        todoInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            addTodo();
          }
        });

        todoList.addEventListener("click", (event) => {
          const target = event.target;
          if (target.classList.contains("check")) {
            toggleComplete(target.dataset.id);
          }
          if (target.classList.contains("icon-btn")) {
            deleteTodo(target.dataset.id);
          }
        });

        filterButtons.forEach((button) => {
          button.addEventListener("click", () => {
            filterButtons.forEach((btn) => btn.classList.remove("active"));
            button.classList.add("active");
            activeFilter = button.dataset.filter;
            renderTodos();
          });
        });

        renderTodos();
      });
    </script>
  </body>
</html>
